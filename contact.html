<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Samrat Subedi</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="me.png">
    <!-- External CSS links -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="contact.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <script src="https://kit.fontawesome.com/1c227c9bf2.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="container-1">
        <div class="navbar">
            <h3><a href="index.html">Samrat Subedi</a></h3>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="passion.html">Passion</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
            <div class="bar">
                <i class="fas fa-bars"></i>
            </div>
        </div>
    </div>

    <div class="contact-container">
        <div class="contact-info">
            <h2>Get in Touch</h2>
            <p>Feel free to reach out to me for any questions or opportunities!</p>
            
            <div class="info-item">
                <i class="fas fa-envelope"></i>
                <div>
                    <h3>Email</h3>
                    <p>subedisamrat30@gmail.com</p>
                </div>
            </div>
            
            <div class="info-item">
                <i class="fas fa-phone"></i>
                <div>
                    <h3>Phone</h3>
                    <p>+0424735851</p>
                </div>
            </div>
            
            <div class="info-item">
                <i class="fas fa-map-marker-alt"></i>
                <div>
                    <h3>Location</h3>
                    <p>Sydney, Australia</p>
                </div>
            </div>

            <div class="social-links">
                <a href="https://www.linkedin.com/in/samrat-subedi-766a77232/"><i class="fab fa-linkedin"></i></a>
                <a href="https://github.com/Samsubedi12"><i class="fab fa-github"></i></a>
                <a href="https://www.facebook.com/samsubedi123/"><i class="fab fa-facebook"></i></a>
            </div>
        </div>

        <div class="contact-form">
            <h2>Send Message</h2>
            <form id="contact-form">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" name="subject" required>
                </div>
                
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>
                
                <button type="submit">Send Message</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('contact-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                subject: document.getElementById('subject').value,
                message: document.getElementById('message').value
            };

            try {
                const response = await fetch('http://localhost:3000/api/contact', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();
                
                if (response.ok) {
                    alert('Thank you for your message! I will get back to you soon.');
                    this.reset();
                } else {
                    throw new Error(data.error);
                }
            } catch (error) {
                alert('Error sending message. Please try again later.');
                console.error('Error:', error);
            }
        });
    </script>
    <footer>
        
        
        <p class="copy"><i class="fa-solid fa-copyright"></i>Copyright 2025. Made by Samrat subedi</p>
    </footer>
</body>
</html>
